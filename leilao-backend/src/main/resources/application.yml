spring:
  application:
    name: leilao-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leilao}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # "update" é conveniente em desenvolvimento. Em produção, use migrations (Flyway/Liquibase) com "validate".
      ddl-auto: update
    open-in-view: false
  jackson:
    # Números monetários sempre como BigDecimal, nunca double.
    deserialization:
      use-big-decimal-for-floats: true
